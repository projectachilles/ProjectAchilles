# Lab endpoint overlay: adds a throwaway Linux endpoint running the
# ProjectAchilles agent, for demos and workshops. Not for production.
#
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml up -d
#   (server install: -f docker-compose.server.yml -f docker-compose.lab.yml)
#
# Enroll it with a token created in the UI:
#   docker exec achilles-lab-endpoint enroll <TOKEN>
#
# Reset it (forget enrollment):
#   docker compose -f docker-compose.yml -f docker-compose.lab.yml rm -sf lab-endpoint
#   docker volume rm <project>_lab-endpoint-data
#
# The lab endpoint always talks to the backend through its own localhost
# forwarder; the backend's AGENT_SERVER_URL (what real agents get) is untouched.
# Details: deploy/lab-endpoint/README.md

services:
  lab-endpoint:
    build:
      context: .
      dockerfile: deploy/lab-endpoint/Dockerfile
      args:
        AGENT_VERSION: "0.7.3" # keep equal to VERSION in agent/Makefile
    platform: linux/amd64
    container_name: achilles-lab-endpoint
    hostname: lab-endpoint
    init: true
    environment:
      - LAB_FORWARD_TO=backend:3000
    volumes:
      - lab-endpoint-data:/opt/f0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  lab-endpoint-data:

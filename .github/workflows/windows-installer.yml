name: Windows installer

# Runs scripts/Install-ProjectAchilles.ps1 end to end (git, docker, the health
# check and prompts are stubbed) and appliance/windows/Import-Achilles.ps1
# against a simulated Hyper-V host (every Hyper-V, CIM and web command is
# stubbed), under Windows PowerShell 5.1 and PowerShell 7.
# 5.1 ships with Windows and is what most users run; breakage specific to it
# (e.g. a three-argument Join-Path) does not show up under pwsh.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/Install-ProjectAchilles.ps1'
      - 'scripts/tests/Test-WindowsInstaller.ps1'
      - 'backend/.env.example'
      - 'appliance/windows/**'
      - '.github/workflows/windows-installer.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/Install-ProjectAchilles.ps1'
      - 'scripts/tests/Test-WindowsInstaller.ps1'
      - 'backend/.env.example'
      - 'appliance/windows/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    name: Installer (${{ matrix.exe }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        exe: [powershell, pwsh]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the installer end to end
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.exe }}
        run: |
          & $env:PS_EXE -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/tests/Test-WindowsInstaller.ps1
          exit $LASTEXITCODE

      - name: Run the appliance import script against a simulated Hyper-V host
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          PS_EXE: ${{ matrix.exe }}
        run: |
          & $env:PS_EXE -NoProfile -NonInteractive -ExecutionPolicy Bypass -File appliance/windows/tests/Test-ImportAchilles.ps1
          exit $LASTEXITCODE

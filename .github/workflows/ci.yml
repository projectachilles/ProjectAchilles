name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-job:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    permissions:
      # Explicitly deny all other permissions to follow the principle of least privilege
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend, backend-serverless]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test

  installer:
    name: Test installer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.mod

      - name: Vet
        working-directory: installer
        run: go vet ./...

      - name: Test
        working-directory: installer
        run: go test ./...

      - name: Test (appliancetest build)
        working-directory: installer
        run: go test -tags appliancetest ./internal/firstboot/ ./internal/cli/

      - name: ShellCheck
        run: |
          files="scripts/deploy-server.sh scripts/ca-renew.sh scripts/install-onprem.sh appliance/build/*.sh appliance/build/provision/*.sh appliance/test/*.sh appliance/rootfs/usr/local/lib/projectachilles/growroot.sh appliance/rootfs/etc/profile.d/achilles-appliance.sh"
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable $files

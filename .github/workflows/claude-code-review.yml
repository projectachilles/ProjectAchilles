name: Claude Code Review

# Fork PRs get no secrets on `pull_request`, and claude-code-action only runs
# for users with write access, so fork PRs are reviewed when a maintainer adds
# the `claude-review` label after reading the diff (`pull_request_target`).
# That run checks out only the BASE branch and reads the PR through the API
# (`gh pr diff`): no PR code is on disk or run. Same as security-review.yml.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"
  pull_request_target: # zizmor: ignore[dangerous-triggers] label-gated by a maintainer; base checkout, PR head as data only, no PR code runs
    types: [labeled]

jobs:
  claude-review:
    if: >-
      github.actor != 'dependabot[bot]' && (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' &&
         github.event.label.name == 'claude-review' &&
         github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Needed to post review comments
      issues: read
      id-token: write
    # One configuration for both review attempts (the retry below runs the same review).
    env:
      REVIEW_PROMPT: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment'
      # Pinned: the action's default model changes with its version
      # The allow rules match whole commands: a pipe, `&&` or `cd` makes every
      # part need its own rule, so `gh pr diff 1 | grep x` is denied, and a
      # review whose reads were all denied ends green having posted nothing.
      # Widening the rules (cat, grep, ...) would let a prompt-injected review
      # read more of the runner, so steer the reads to the built-in tools.
      REVIEW_ARGS: |
        --model claude-opus-5-5
        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
        --append-system-prompt "Shell commands here are allowed one at a time: run each gh command on its own, with no pipes, &&, ;, redirection or cd (for example gh pr diff 123 or gh pr view 123 --json files). Anything chained is denied. Read and search source files with the Read, Grep and Glob tools, never cat, grep, head or wc. The PR's changes come from gh pr diff; files on disk may be the base branch."

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so review subagents can use git log/show/diff (auto-approved
          # as read-only) without git fetch. Don't add Bash(git ...) allow rules: they
          # bypass that read-only check and allow --output and --no-index.
          # On pull_request_target this is the BASE branch (checkout's default):
          # no PR file is ever checked out.
          fetch-depth: 0
          persist-credentials: false


      # Fork PRs (pull_request_target): Claude reads untrusted text while the
      # job holds secrets. CLAUDE_CODE_SUBPROCESS_ENV_SCRUB (below) strips
      # credentials from every subprocess Claude starts and runs them in a PID
      # namespace, so a prompt-injected `gh pr comment --body "$SECRET"` has
      # nothing to leak. It needs bubblewrap and socat (Claude Code refuses every
      # Bash call without them: "Sandbox dependencies not available"); Ubuntu 24.04 restricts
      # unprivileged user namespaces via AppArmor. If the sandbox can't start,
      # this step fails and no review runs (fail closed).
      - name: Prepare the subprocess sandbox (fork PRs)
        if: github.event_name == 'pull_request_target'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid true
          command -v socat >/dev/null
          echo "bubblewrap + socat OK"

      - name: Note the review start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        env:
          # 1 on fork PRs (see the sandbox step); same-repo PRs keep today's behaviour.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ github.event_name == 'pull_request_target' && '1' || '0' }}
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # pull_request_target (fork PRs): the Claude GitHub App rejects the
          # OIDC token exchange for this event (401 Invalid OIDC token), so use
          # the job's own short-lived GITHUB_TOKEN, scoped to the permissions
          # above, as claude-code-action's docs/security.md recommends for
          # base-repo-context events. The write-access check on the actor (the
          # maintainer who added the label) still applies. Same-repo PRs keep
          # the app token (empty input = not set).
          github_token: ${{ github.event_name == 'pull_request_target' && secrets.GITHUB_TOKEN || '' }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Without --comment the plugin stops after the review and posts nothing
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

      # Full output stays hidden (public repo); list only which tool calls were
      # denied. The action writes its log to one fixed path, so each attempt is
      # reported (and checked) before the next one overwrites it.
      - name: Report denied tool calls
        continue-on-error: true # Reporting only; never fail the review over it
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          ATTEMPT: 1
        run: bash .github/scripts/claude-review-outcome.sh report

      # A green job must mean the review ran. Posting nothing is normal for a
      # trivial PR, but not when tool calls were denied: then the review may
      # not have been able to read the diff ("empty"). The plugin reviews a PR
      # only once, so when claude[bot] reviewed an earlier push, posting nothing
      # now is by design ("prior"). See .github/scripts/claude-review-outcome.sh.
      - name: Check the review posted
        id: first
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
        run: echo "outcome=$(bash .github/scripts/claude-review-outcome.sh outcome)" >> "$GITHUB_OUTPUT"

      # A review that a stray denied command left empty usually succeeds on a
      # second run, so retry once with the same configuration (no new
      # permissions) instead of failing and waiting for a manual re-run.
      - name: Run Claude Code Review again (one retry)
        id: claude-review-retry
        if: steps.first.outputs.outcome == 'empty'
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: ${{ github.event_name == 'pull_request_target' && '1' || '0' }}
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.event_name == 'pull_request_target' && secrets.GITHUB_TOKEN || '' }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.REVIEW_ARGS }}

      - name: Report denied tool calls (retry)
        continue-on-error: true
        if: always() && steps.claude-review-retry.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review-retry.outputs.execution_file }}
          ATTEMPT: 2
        run: bash .github/scripts/claude-review-outcome.sh report

      - name: Fail when denied tool calls left no review
        if: always() && steps.first.outputs.outcome != ''
        env:
          FIRST: ${{ steps.first.outputs.outcome }}
          RETRY_FILE: ${{ steps.claude-review-retry.outputs.execution_file }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
        run: |
          case "$FIRST" in
            ok) echo "The review ran." ;;
            prior)
              msg="Claude reviewed an earlier push of this PR and the code-review plugin does not review a PR twice, so commits pushed after that review were not reviewed."
              echo "::warning::$msg"
              { echo "### Review skipped"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY" ;;
            empty)
              if [ -z "$RETRY_FILE" ]; then
                echo "::error::Tool calls were denied, the review posted nothing, and the retry did not run. Re-run this job."
                exit 1
              fi
              second=$(EXECUTION_FILE="$RETRY_FILE" bash .github/scripts/claude-review-outcome.sh outcome)
              if [ "$second" = "empty" ]; then
                echo "::error::Tool calls were denied and neither review attempt posted anything. Re-run this job."
                exit 1
              fi
              msg="The first review attempt posted nothing after denied tool calls; the retry ran (outcome: $second)."
              echo "::notice::$msg"
              { echo "### Review retried"; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "::error::Unexpected review outcome '$FIRST'."; exit 1 ;;
          esac

      # One review per label: the next push needs a fresh look and a new label.
      - name: Remove the review label
        if: always() && github.event_name == 'pull_request_target'
        continue-on-error: true # the security-review workflow may have removed it already
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label claude-review

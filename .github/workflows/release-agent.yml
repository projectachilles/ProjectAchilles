name: Release Agent

on:
  push:
    tags: ['agent-v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-agent
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Ensure tag commit is on main
        env:
          TAG_REF: ${{ github.ref }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_REF")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag does not point to a commit on main"
            exit 1
          fi

  test:
    name: Test Agent
    needs: verify-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go test ./...
      - run: go vet ./...

  build:
    name: Build Agent Binaries
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Consumed by the release job so an unsigned binary is called out in the
      # release notes, not just in a log line nobody reads.
      windows_signed: ${{ steps.sign_windows.outputs.windows_signed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Extract version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: echo "version=${TAG_NAME#agent-v}" >> "$GITHUB_OUTPUT"

      - name: Build all platforms
        working-directory: agent
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: make build-all VERSION="$BUILD_VERSION"

      - name: Sign Windows binary
        id: sign_windows
        working-directory: agent
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Set the repository variable REQUIRE_SIGNED_AGENT_RELEASE to 'true'
          # to make an unsigned Windows binary fail the release outright.
          REQUIRE_SIGNED: ${{ vars.REQUIRE_SIGNED_AGENT_RELEASE }}
        run: |
          set -euo pipefail
          BIN=dist/achilles-agent-windows-amd64.exe

          # Skipping used to print one line and exit 0, which is how
          # agent-v0.6.3 shipped an unsigned .exe without anyone noticing.
          # Every path out of this step now records windows_signed, annotates
          # the run, and writes to the job summary.
          fail_or_warn() {
            echo "windows_signed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### :warning: Windows binary is UNSIGNED"
              echo ""
              echo "$1"
              echo ""
              echo "Endpoints enforcing WDAC or application control will refuse to run it."
              echo "Sign it per-tenant via Settings → Agent → Upload Agent Binary, or configure"
              echo "the \`WINDOWS_CERT_PFX\` / \`WINDOWS_CERT_PASSWORD\` secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${REQUIRE_SIGNED:-}" = "true" ]; then
              echo "::error::Windows binary is unsigned and REQUIRE_SIGNED_AGENT_RELEASE is set. $1"
              exit 1
            fi
            echo "::warning::Windows binary is UNSIGNED. $1"
          }

          if [ -z "$WINDOWS_CERT_PFX" ]; then
            fail_or_warn "No WINDOWS_CERT_PFX secret is configured, so signing was skipped."
            exit 0
          fi

          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode > /dev/null

          echo "$WINDOWS_CERT_PFX" | base64 -d > /tmp/cert.pfx
          trap 'rm -f /tmp/cert.pfx' EXIT

          if ! osslsigncode sign \
            -pkcs12 /tmp/cert.pfx \
            -pass "$WINDOWS_CERT_PASSWORD" \
            -n "Achilles Agent" \
            -t http://timestamp.digicert.com \
            -in "$BIN" \
            -out dist/achilles-agent-windows-amd64-signed.exe; then
            fail_or_warn "osslsigncode failed."
            exit 0
          fi

          mv dist/achilles-agent-windows-amd64-signed.exe "$BIN"

          # Confirm the signature actually landed rather than trusting the exit
          # code. osslsigncode exits NON-ZERO for a signed-but-untrusted chain
          # too, so this greps the output text; the exact wording is
          # osslsigncode 2.x and must be re-checked against the tool if the
          # pinned version changes.
          # Capture first, then grep. Piping directly would be wrong under
          # `set -o pipefail`: osslsigncode exits non-zero for a signed-but-
          # untrusted chain, so the pipeline fails even when grep matched, and
          # a correctly signed binary is reported as unsigned.
          VERIFY_OUT=$(osslsigncode verify "$BIN" 2>&1 || true)
          if printf '%s' "$VERIFY_OUT" |
               grep -qiE 'Number of verified signatures|Signature Index:'; then
            echo "windows_signed=true" >> "$GITHUB_OUTPUT"
            echo "### :lock: Windows binary signed" >> "$GITHUB_STEP_SUMMARY"
          else
            fail_or_warn "osslsigncode reported success but the binary carries no signature."
          fi

      - name: Sign macOS binaries (ad-hoc)
        run: |
          # Install rcodesign from pre-built GitHub release
          RCODESIGN_VERSION="0.27.0"
          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F${RCODESIGN_VERSION}/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar xz -C /tmp
          RCODESIGN="/tmp/apple-codesign-${RCODESIGN_VERSION}-x86_64-unknown-linux-musl/rcodesign"
          chmod +x "$RCODESIGN"

          # Signing without a certificate produces an ad-hoc signature
          "$RCODESIGN" sign agent/dist/achilles-agent-darwin-amd64
          "$RCODESIGN" sign agent/dist/achilles-agent-darwin-arm64

      - name: Regenerate checksums after signing
        working-directory: agent
        run: make checksum

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: agent-binaries
          path: agent/dist/
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: agent-binaries
          path: dist/

      - name: Extract version
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: echo "version=${TAG_NAME#agent-v}" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          AGENT_VERSION: ${{ steps.version.outputs.version }}
          WINDOWS_SIGNED: ${{ needs.build.outputs.windows_signed }}
        run: |
          # Look for ## Agent [X.Y.Z] section in changelog
          NOTES=$(awk -v ver="$AGENT_VERSION" '
            /^## Agent \[/ {
              if (found) exit
              if ($0 ~ "\\[" ver "\\]") { found=1; next }
            }
            found && /^## / { exit }
            found { print }
          ' docs/CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Agent release ${AGENT_VERSION}. See [CHANGELOG.md](docs/CHANGELOG.md) for details."
          fi

          # Lead with the signing status when the Windows binary is unsigned —
          # someone downloading the .exe needs to know before they deploy it.
          : > /tmp/release-notes.md
          if [ "$WINDOWS_SIGNED" != "true" ]; then
            cat >> /tmp/release-notes.md << 'UNSIGNED'
          > [!WARNING]
          > **The Windows binary in this release is not code-signed.**
          > Endpoints enforcing WDAC or application control will refuse to run it.
          >
          > Sign it with your own certificate at **Settings → Agent → Upload Agent
          > Binary**, which signs on upload and is the recommended path anyway:
          > the artifact's provenance comes from this tagged build, the signature
          > from the certificate your fleet actually trusts.

          UNSIGNED
          fi

          # Write release notes with installation header
          cat >> /tmp/release-notes.md << 'HEADER'
          ## Installation

          Download the binary for your platform and enroll:

          ```bash
          # Linux
          chmod +x achilles-agent-linux-amd64
          sudo ./achilles-agent-linux-amd64 --enroll TOKEN --server https://your-server.example.com --install

          # macOS (Apple Silicon)
          chmod +x achilles-agent-darwin-arm64
          sudo ./achilles-agent-darwin-arm64 --enroll TOKEN --server https://your-server.example.com --install

          # Windows (PowerShell as Administrator)
          .\achilles-agent-windows-amd64.exe --enroll TOKEN --server https://your-server.example.com --install
          ```

          ## Verify checksums

          ```bash
          sha256sum -c SHA256SUMS
          ```

          ---

          HEADER

          echo "$NOTES" >> /tmp/release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          AGENT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG_NAME" \
            --title "Achilles Agent $AGENT_VERSION" \
            --notes-file /tmp/release-notes.md \
            --latest=false \
            dist/*

name: Appliance Image

# Builds the sealed Windows appliance image and boot-tests it under QEMU/OVMF.
#   pull_request      quick boot-test, no artifact
#   workflow_dispatch quick, or full + Hyper-V zip artifact when `full` is set;
#                     pick the branch or tag with `gh workflow run … --ref <ref>`
#   push of v*.*.*    full boot-test of the release tag + Hyper-V zip artifact
# The job only ever checks out the ref it runs on: building another ref
# (workflow_run, a `ref` input) would let that code write caches restored by
# default-branch runs (CodeQL actions/cache-poisoning).

on:
  pull_request:
    paths:
      - 'appliance/**'
      - 'installer/**'
      - 'scripts/deploy-server.sh'
      - 'docker-compose.server.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - '.github/workflows/appliance.yml'
  workflow_dispatch:
    inputs:
      full:
        description: 'Full boot-test (install, backup, restore) and upload the Hyper-V zip'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: appliance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appliance:
    name: Build and boot-test appliance
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MODE: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full)) && 'full' || 'quick' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the image version is `git describe`.
          fetch-depth: 0
          persist-credentials: false

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # No Go cache: the installer is built once per run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: installer/go.mod
          cache: false

      - name: Build, check and boot-test the image (${{ env.MODE }})
        run: make -C appliance builder installer-bin installer-testbin image check-sealed boot-test MODE="$MODE"

      - name: Package for Hyper-V
        if: env.MODE == 'full'
        run: make -C appliance vhdx

      # Copied next to the zip so the artifact stays flat: upload-artifact roots
      # a multi-directory path list at the common ancestor (appliance/), which
      # would nest the files under out/ and windows/ and break publish's dist/.
      - name: Stage the import script
        if: env.MODE == 'full'
        run: cp appliance/windows/Import-Achilles.ps1 appliance/out/Import-Achilles.ps1

      # Only the zip, its checksum and the import script: never repo.bundle or
      # the qcow2 (logs of a failed run go to appliance-logs, below).
      - name: Upload Hyper-V package
        if: env.MODE == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appliance-hyperv
          path: |
            appliance/out/ProjectAchilles-*-hyperv.zip
            appliance/out/appliance-SHA256SUMS
            appliance/out/Import-Achilles.ps1
          if-no-files-found: error
          retention-days: 7

      # Diagnostics for a failed build or boot test, kept one day. Packer's log
      # and the build VM's console: build-image.sh greps both for the build
      # password and its hash, and deletes a file that holds either before it
      # fails. Boot-test logs come from throwaway VMs configured with the
      # placeholder fixtures in appliance/test/. Never the qcow2, the VM disks,
      # the backup or repo.bundle.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appliance-logs
          path: |
            appliance/out/packer.log
            appliance/out/serial.log
            appliance/out/boot-test/**/*.log
          if-no-files-found: ignore
          retention-days: 1

  # Publishes a release build. Trust split: the zip goes to R2 (public, large);
  # the authoritative appliance-SHA256SUMS goes on the GitHub release, because
  # Import-Achilles.ps1 fetches the checksum from GitHub and the zip from R2, so
  # a compromised bucket cannot swap the zip and its checksum together.
  # Write access is job-scoped, so this job never checks out the repo: no PR or
  # tag code runs with the write token, it only handles the downloaded artifact.
  publish:
    name: Publish appliance to R2 and the release
    needs: appliance
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Fail loudly: a release without a download link must not look green.
      - name: Require R2 configuration
        run: |
          missing=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty: set it as a repository secret (variable for R2_PUBLIC_BASE_URL) before tagging a release"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appliance-hyperv
          path: dist

      - name: Resolve the version and zip name
        run: |
          shopt -s nullglob
          zips=(dist/ProjectAchilles-*-hyperv.zip)
          if [ "${#zips[@]}" -ne 1 ] || [ ! -s dist/appliance-SHA256SUMS ] || [ ! -s dist/Import-Achilles.ps1 ]; then
            echo "::error::expected exactly one Hyper-V zip, appliance-SHA256SUMS and Import-Achilles.ps1 in dist/, found: $(ls dist)"
            exit 1
          fi
          zip_name="$(basename "${zips[0]}")"
          ver="${zip_name#ProjectAchilles-}"
          ver="${ver%-hyperv.zip}"
          # The release tag is the version as-is (it already starts with "v").
          case "$ver" in
            v[0-9]*) ;;
            *) echo "::error::cannot derive a v-prefixed version from $zip_name"; exit 1 ;;
          esac
          {
            echo "ZIP_NAME=$zip_name"
            echo "VER=$ver"
          } >> "$GITHUB_ENV"

      # R2 rejects the CRC checksums recent AWS CLI versions add by default.
      - name: Upload the zip to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          aws s3 cp "dist/$ZIP_NAME" "s3://$R2_BUCKET/appliance/" \
            --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          echo "Download URL: ${R2_PUBLIC_BASE_URL%/}/appliance/$ZIP_NAME" >> "$GITHUB_STEP_SUMMARY"

      # The release is created by a separate workflow on the same tag, so it may
      # not exist yet. Never upload to a guessed tag: wait, or fail.
      - name: Attach the checksum to the release
        run: |
          for i in $(seq 1 40); do
            if gh release view "$VER" >/dev/null 2>&1; then
              gh release upload "$VER" dist/appliance-SHA256SUMS dist/Import-Achilles.ps1 --clobber
              exit 0
            fi
            echo "Release $VER not found yet (attempt $i/40), waiting 30s"
            sleep 30
          done
          echo "::error::release $VER did not appear within 20 minutes; checksum not attached"
          exit 1

      - name: Verify the round trip
        run: |
          url="${R2_PUBLIC_BASE_URL%/}/appliance/$ZIP_NAME"
          curl -fsSLI "$url" >/dev/null || { echo "::error::$url is not publicly reachable"; exit 1; }
          assets="$(gh release view "$VER" --json assets --jq '.assets[].name')"
          for a in appliance-SHA256SUMS Import-Achilles.ps1; do
            if ! grep -qx "$a" <<<"$assets"; then
              echo "::error::$a is not attached to release $VER"
              exit 1
            fi
          done
          echo "Verified $url and the release checksum asset" >> "$GITHUB_STEP_SUMMARY"

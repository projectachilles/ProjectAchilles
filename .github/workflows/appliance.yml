name: Appliance Image

# Builds the sealed Windows appliance image and boot-tests it under QEMU/OVMF.
#   pull_request     quick boot-test, no artifact
#   workflow_dispatch full boot-test only when `full` is set
#   workflow_run     full boot-test of a successful platform release + Hyper-V zip artifact

on:
  pull_request:
    paths:
      - 'appliance/**'
      - 'installer/**'
      - 'scripts/deploy-server.sh'
      - 'docker-compose.server.yml'
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - '.github/workflows/appliance.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build (default: the selected branch)'
        required: false
        type: string
      full:
        description: 'Full boot-test (install, backup, restore) and upload the Hyper-V zip'
        required: false
        type: boolean
        default: false
  workflow_run:
    workflows: ['Release Platform']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: appliance-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  appliance:
    name: Build and boot-test appliance
    runs-on: ubuntu-latest
    timeout-minutes: 150
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      MODE: ${{ (github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.full)) && 'full' || 'quick' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: the image version is `git describe`.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.ref || '' }}

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      # No Go cache: this job checks out a chosen ref (inputs.ref or the release
      # commit), and a cache it saved would be restored by default-branch runs
      # (cache poisoning). The installer builds once per run anyway.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: installer/go.mod
          cache: false

      - name: Build, check and boot-test the image (${{ env.MODE }})
        run: make -C appliance builder installer-bin installer-testbin image check-sealed boot-test MODE="$MODE"

      - name: Package for Hyper-V
        if: env.MODE == 'full'
        run: make -C appliance vhdx

      # Only the zip and its checksum: never repo.bundle or the qcow2 (logs of a
      # failed run go to appliance-logs, below).
      - name: Upload Hyper-V package
        if: env.MODE == 'full'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appliance-hyperv
          path: |
            appliance/out/ProjectAchilles-*-hyperv.zip
            appliance/out/appliance-SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      # Diagnostics for a failed build or boot test, kept one day. Packer's log
      # and the build VM's console: build-image.sh greps both for the build
      # password and its hash, and deletes a file that holds either before it
      # fails. Boot-test logs come from throwaway VMs configured with the
      # placeholder fixtures in appliance/test/. Never the qcow2, the VM disks,
      # the backup or repo.bundle.
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appliance-logs
          path: |
            appliance/out/packer.log
            appliance/out/serial.log
            appliance/out/boot-test/**/*.log
          if-no-files-found: ignore
          retention-days: 1

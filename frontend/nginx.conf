server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy to backend
    location /api/ {
        client_max_body_size 50m;
        # Some calls still build synchronously and can take minutes: test builds
        # from older CLIs/scripts (no ?async=true) and agent "Build from source".
        # nginx's 60 s default turned those into 504s while the backend kept
        # building. 600 s covers a cold build (the backend allows 5 min per step).
        # Keep directives inside this block and free of braces: on PaaS,
        # docker-entrypoint.sh deletes the block from its opening line up to
        # the first closing brace.
        proxy_read_timeout 600s;
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy (forward-compatible)
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Content-hashed build assets (Vite/Rolldown emit e.g. index-BfB2p8G4.js).
    # The filename changes whenever the contents change, so it is safe to cache
    # forever. Crucially, a MISSING asset must 404 instead of falling back to
    # index.html: a stale client requesting a deleted chunk should get a clean
    # error to recover from, NOT HTML served with a application/javascript intent
    # (which is what produced "Failed to fetch dynamically imported module").
    #
    # The immutable header must NOT carry `always`: with it, nginx also sent it on
    # the 404, so a browser that once asked for a chunk the serving instance did
    # not have (a deploy switching instances) kept that 404 for a year and never
    # asked again. Every page importing that chunk then failed in that browser,
    # reloads included. Without `always`, add_header applies to 2xx/3xx only;
    # the missing-asset 404 is sent with no-store instead.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
        error_page 404 = @missing_asset;
    }

    location @missing_asset {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    # index.html is the only un-hashed entry point. It must never be cached, or
    # clients keep booting an old bundle (with old chunk hashes) after a deploy.
    # nginx resets inherited add_header directives inside a location, so the
    # server-level security headers are re-declared here.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
